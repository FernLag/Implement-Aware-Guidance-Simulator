# Implement catalog. All values SI.
#
# Working width is the primary independent variable of Stage 6, so it is
# sourced for every entry. Where a manufacturer publishes row count and row
# spacing rather than a width figure, width is the product of the two and the
# `note` records the derivation.
#
# hitch_distance and implement_wheelbase are assumed for every trailed entry.
# They are the 'a' and 'b' terms of the one-trailer kinematic model:
#   a = tractor rear axle -> drawbar hitch point   (~0.9 m)
#   b = hitch point -> implement axle              (3-6 m)
# An earlier revision of this file conflated the two, giving 'a' the 3-6 m
# figure that belongs to 'b'. No manufacturer publishes either. Stage 6 sweeps hitch distance as an independent variable, so no
# reported result may depend on these defaults -- they are starting points
# for the sweep, not findings.
#
# draft_power_per_width is the Stage 0 pairing check's power demand term. The
# full ASABE D497 draft model (f_s * (A + B*v + C*v^2) * w * d) is the correct
# long-term replacement, but its A/B/C coefficient table sits behind the
# paywalled standard and is deliberately NOT reproduced from memory here.
# Only the John Deere 2230FH figure below is manufacturer-published; the rest
# are assumed and anchored to it.

implements:
  - id: landpride_rcr1860
    manufacturer: Land Pride
    model: RCR1860
    type: mounted
    draft_class: rotary_cutter
    working_width:
      value: 1.524
      unit: m
      source: https://www.manualshelf.com/manual/land-pride/rcr1860-series/rotary-cutters-single-deck-specifications-capacities.html
      note: "60 in cutting width as printed"
    mass:
      value: 271.7
      unit: kg
      source: https://www.manualshelf.com/manual/land-pride/rcr1860-series/rotary-cutters-single-deck-specifications-capacities.html
      note: "599 lb as printed"
    draft_power_per_width:
      value: 6000
      unit: W/m
      assumed: true
      rationale: >-
        No published draft figure. A rotary cutter does not engage soil, so
        demand is well below the tillage anchor (John Deere 2230FH,
        19600-29400 W/m). The intensity ordering across this catalog
        (disk > cultivator > planter > drill > cutter) is assumed, not sourced.

  - id: jd_1590_10ft
    manufacturer: John Deere
    model: 1590 No-Till Drill (10 ft)
    type: trailed
    draft_class: no_till_drill
    working_width:
      value: 3.048
      unit: m
      source: https://www.deere.com/en/seeding-equipment/1590-no-till-drill/
      note: "offered in 10-, 15- and 20-ft sizes; this is the 10-ft"
    mass:
      value: 2300
      unit: kg
      assumed: true
      rationale: >-
        John Deere does not publish machine mass for the 1590. Nominal
        placeholder. Implement mass is not consumed by Stages 1-6 (the model
        is kinematic); it is carried for the Stage 7 URDF and must be
        replaced with a dealer spec sheet figure before Stage 7.
    hitch_distance:
      value: 0.85
      unit: m
      assumed: true
      rationale: >-
        Distance from the TRACTOR REAR AXLE to the drawbar hitch point (the
        'a' term of the one-trailer model). Not published, and strictly a
        property of the pairing rather than of the implement. 0.9 m is
        representative of a rear drawbar. Stage 6 sweeps hitch distance, so
        no result may depend on this default.
    implement_wheelbase:
      value: 3.0
      unit: m
      assumed: true
      rationale: >-
        Distance from the hitch point to the implement axle (the 'b' term of
        the one-trailer model), the length that sets how fast hitch angle
        responds. Not published. Nominal value for a single-axle drawn box drill. Stage 6 sweeps
        this geometry.
    draft_power_per_width:
      value: 10000
      unit: W/m
      assumed: true
      rationale: >-
        No published draft figure. Anchored below the tillage figure (John
        Deere 2230FH, 19600-29400 W/m) since no-till seeding disturbs far
        less soil than full-width cultivation. Ordering assumed, not sourced.

