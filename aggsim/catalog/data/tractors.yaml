# Tractor catalog. All values SI. Every parameter carries either a `source`
# URL or `assumed: true` with a rationale -- see aggsim/catalog/param.py.
#
# Wheelbases are converted from the inch figure (higher printed precision);
# the `note` records the figure as printed so the conversion stays checkable.
#
# steering_type distinguishes front-wheel steering from frame articulation.
# Articulated machines are catalogued for reference but from_tractor() refuses
# them: the Stage 1 bicycle model steers by a wheel angle and cannot represent
# a pivot joint between two bodies.
#
# max_steer_angle is assumed for every entry: TractorData does not publish
# steering geometry, and manufacturers rarely do.
#
# drawbar_power is sourced from Nebraska tractor test results where one
# exists. Where it does not, it is assumed as 0.756 x gross engine power --
# the mean drawbar/gross ratio of the four Nebraska-tested tractors in this
# same catalog (8R 410 0.806, 6145R 0.741, T7.270 0.725, Magnum 340 0.754).

tractors:
  - id: jd_5075e
    manufacturer: John Deere
    model: 5075E
    years: "2008-2025"
    tire_front: "9.5-24"
    tire_rear: "16.9-28"
    wheelbase:
      value: 2.050
      unit: m
      source: https://www.tractordata.com/farm-tractors/008/1/0/8108-john-deere-5075e-dimensions.html
      note: "80.7 in / 204 cm as printed"
    mass:
      value: 3299
      unit: kg
      source: https://www.tractordata.com/farm-tractors/008/1/0/8108-john-deere-5075e-dimensions.html
      note: "4WD Cab, 7275 lb / 3299 kg as printed"
    engine_power:
      value: 55927
      unit: W
      source: https://www.tractordata.com/farm-tractors/005/7/9/5793-john-deere-5075e.html
      note: "75 hp gross / 55.9 kW as printed"
    drawbar_power:
      value: 42280
      unit: W
      assumed: true
      rationale: >-
        No Nebraska drawbar test published for this model. Taken as 0.756 x
        gross engine power, the mean drawbar/gross ratio of the four
        Nebraska-tested tractors in this catalog.
    max_steer_angle:
      value: 0.7854
      unit: rad
      assumed: true
      rationale: >-
        Steering geometry is not published. 45 deg is the midpoint of the
        40-55 deg range typical of MFWD utility tractors. Affects only
        saturation, which straight-line tracking should never reach.

