        The MK-V specification sheet lists a "Base Weight" row but the
        value could not be extracted from the PDF's column layout. Secondary
        sources report 5,750 lb (2,610 kg); that figure is recorded here as
        an assumption, not as sourced. Mass is unused by Stages 1-6.
    engine_power:
